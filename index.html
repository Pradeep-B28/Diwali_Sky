<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>Diwali Sky by Wrench Wise</title>
  <meta name="description" content="Someone wrote your name in the Diwali sky. Tap to see it.">

  <!-- Open Graph -->
  <meta property="og:title" content="Diwali Sky by Wrench Wise">
  <meta property="og:description" content="Someone wrote your name in the Diwali sky. Tap to see it.">
  <meta property="og:image" content="https://diwalisky.vercel.app/assets/og-image.png">
  <meta property="og:url" content="https://diwalisky.vercel.app">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 3px brand gradient bar across the very top -->
  <div id="brand-bar"></div>

  <div id="app-container">
    <!-- Back canvas: sky gradient, stars, and diyas -->
    <canvas id="sky-canvas"></canvas>
    <!-- Front canvas: fireworks and trails -->
    <canvas id="fireworks-canvas"></canvas>
    <!-- Bloom canvas: soft glow overlay (High tier) -->
    <canvas id="bloom-canvas"></canvas>

    <!-- Top overlay bar -->
    <header class="top-bar">
      <div id="logo-chip" class="logo-chip" title="Wrench Wise">
        <img id="logo-img" src="assets/logo.png" alt="Wrench Wise" />
        <span id="logo-text" class="logo-text">Wrench Wise</span>
      </div>
      <div class="top-right-bar">
        <div id="debug-hud" class="debug-hud" style="display: none;" hidden>
          <div class="debug-metrics">
            <span id="debug-fps">FPS: --</span>
            <span id="debug-particles">Particles: 0</span>
            <span id="debug-rockets">Rockets: 0</span>
          </div>
          <div class="debug-buttons">
            <button type="button" class="debug-btn" data-burst="peony">Peony</button>
            <button type="button" class="debug-btn" data-burst="ring">Ring</button>
            <button type="button" class="debug-btn" data-burst="willow">Willow</button>
            <button type="button" class="debug-btn" data-burst="crackle">Crackle</button>
            <button type="button" class="debug-btn" id="debug-show-btn">Play Show</button>
          </div>
        </div>
        <button id="mute-btn" class="mute-chip" type="button" aria-label="Mute sound" title="Mute sound">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- UI Overlay for Sender, Receiver, and Share Cards -->
    <div id="ui-container" class="ui-container"></div>
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', () => {
        const banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:#E11D48;color:#FFFFFF;padding:12px 20px;border-radius:12px;font-family:sans-serif;font-size:14px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.5);text-align:center;max-width:90%;';
        banner.textContent = 'Please open via http://localhost:8000. Web browsers require a local server to run JavaScript modules.';
        document.body.appendChild(banner);
      });
    }
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
